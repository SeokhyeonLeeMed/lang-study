name: daily-reminder
# 매일 알림: 한국 시각 19:47에 예약(GitHub 예약 실행은 보통 몇~수십 분 늦는다 → 대개 저녁 8시 무렵 도착)
# secrets: VAPID_JWK, SUPABASE_URL, SUPABASE_SERVICE_KEY, OWNER_UID. 구독 목록은 앱이 서버에 넣는다(push.mjs 참고).
on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
      - run: node .github/push.mjs
        env:
          VAPID_JWK: ${{ secrets.VAPID_JWK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
